name: Build Thunderbird Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-thunderbird-apk.yml'
      - 'app-thunderbird/**'
      - 'app-common/**'
      - 'feature/widget/message-list/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: thunderbird-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build and upload Thunderbird test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Build installable test variant
        run: ./gradlew :app-thunderbird:assembleFossDebug -Pci=true

      - name: Upload Thunderbird test APK
        uses: actions/upload-artifact@v4
        with:
          name: thunderbird-test-apk
          path: app-thunderbird/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
